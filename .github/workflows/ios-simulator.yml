name: iOS Simulator build (Appetize)

on:
  # LANCEMENT MANUEL UNIQUEMENT (quand l'utilisateur le demande) :
  # GitHub Actions -> iOS Simulator build -> Run workflow.
  workflow_dispatch:

concurrency:
  group: ios-sim
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build .app simulateur iOS
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://agnaafnujcwswstcwfuw.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnbmFhZm51amN3c3dzdGN3ZnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0OTY4MzYsImV4cCI6MjEwNDA3MjgzNn0.uNaybs9x4fG_t8Fe01tqyTvGTgwrFmU1A3MH7o5VBnE
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Patch expo-modules-jsi (bug Xcode 26/Swift 6.2 - expo/expo#49214)
        run: |
          FILE=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          sed -i.bak 's/^  SWIFT_RETURNS_RETAINED RuntimeScheduler(/  RuntimeScheduler(/' "$FILE"
          rm -f "$FILE.bak"
          N=$(grep -c "SWIFT_RETURNS_RETAINED" "$FILE" || true)
          echo "SWIFT_RETURNS_RETAINED restants: $N"
          test "$N" = "0" || { echo "PATCH INCOMPLET"; exit 1; }

      - name: Select Xcode 26+ (Swift 6.2 requis par le package SPM)
        run: |
          ls -d /Applications/Xcode_26*.app /Applications/Xcode*.app 2>/dev/null || true
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app ]; then XCODE_PATH=/Applications/Xcode.app; fi
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH"; fi
          xcodebuild -version
          swift --version | head -2

      - name: Expo prebuild (génère le projet natif iOS)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Pod install
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build simulateur iOS (Release, bundle JS embarqué)
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Fable.xcworkspace \
            -scheme Fable \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zipper le .app
        working-directory: apps/mobile/ios/build/Build/Products/Release-iphonesimulator
        run: |
          ls -la
          zip -r Fable-simulator.zip Fable.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fable-ios-simulator
          path: apps/mobile/ios/build/Build/Products/Release-iphonesimulator/Fable-simulator.zip
          retention-days: 14